name: vibe_coding
title: "Разработка с ИИ-инструментами (vibe coding)"

keywords:
  - "vibe coding"
  - "AI-разработчик"
  - "разработчик с ИИ"
  - "промпт-инженер"
  - "prompt engineer"
  - "LLM"
  - "AI-автоматизация"
  - "no-code"

# отсеиваем по заголовку до оценки, чтобы не жечь токены
exclude_keywords:
  - "senior"
  - "lead"
  - "тимлид"
  - "5+ лет"
  - "от 5 лет"

regions: []          # заполнится, когда будет известен город
schedule:            # ответ 29.10.2026
  - удалённо
  - гибрид
employment:
  - полная
  - частичная
  - проектная
salary_min: null     # СПРОСИТЬ: без этого слагаемое в оценке не работает
level: junior

# Без этих списков локальная оценка опирается только на ключевые слова
# и ограничена потолком 75 — см. docs/search-profiles.md
must_have_skills:
  - Python
nice_to_have_skills:
  - Docker
  - Linux
  - PostgreSQL
  - FastAPI

# стоп-факторы: вакансия отбрасывается независимо от оценки
deal_breakers:
  - "релокация обязательна"
  - "неоплачиваемая стажировка"

score_threshold: 70
