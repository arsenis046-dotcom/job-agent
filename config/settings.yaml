# Общие настройки. Специфика сферы поиска живёт в config/search_profiles/.

# dry_run — ничего не отправляется, только черновики в output/
# approve  — каждый отклик показывается и ждёт моего подтверждения
# auto     — отправляет сам всё, что выше порога, в пределах дневного лимита
mode: dry_run

active_profile: vibe_coding

limits:
  applications_per_day: 10
  score_threshold: 70
  request_delay_seconds: 1.5
  max_requests_per_minute: 30

llm:
  model: claude-sonnet-5-5
  # для рыночного анализа и сложной оценки
  model_heavy: claude-opus-5-5
  max_tokens: 4096

# Режимы доступа — обоснование в docs/api_notes.md
platforms:
  hh:
    enabled: true
    # manual — вакансии я приношу сам. Это единственный режим для hh.ru:
    # API для соискателей закрыт с 15.12.2025 (так пишет сама форма заявки
    # на dev.hh.ru), а чтение RSS программой попадает под запрет п. 6.1.38
    # Условий сайта. Режимы api и rss в коде остались на случай, если hh
    # ответит, что путь есть. Разбор — docs/hh-application.md
    access: manual
    # api — POST /negotiations; draft — черновик письма + ссылка
    apply: draft
    # false: п. 4.6 Условий API hh.ru запрещает передавать полученные данные
    # сторонним сервисам, а модель — сторонний сервис. Вопрос отправлен
    # в api@hh.ru, до ответа оценка и письма для hh.ru только локальные
    use_model: false
  superjob:
    enabled: true
    access: api
    apply: api
    # в правилах SuperJob такого запрета нет (docs/superjob-application.md)
    use_model: true
  # Публичные телеграм-каналы с вакансиями. Читаем официальным интерфейсом
  # Telegram под своим аккаунтом (docs/telegram.md). Откликов в каналах нет:
  # отвечают письмом или в личку, поэтому apply всегда draft.
  telegram:
    # Включить после `jobagent telegram login`: без входа читать нечем,
    # и площадка молча ничего не даст
    enabled: false
    access: api
    apply: draft
    use_model: true
    channels:
      # Проверить и поправить под себя: канал мог переехать или заглохнуть
      - devjobs
      - forallprogrammers
      - it_bl
      - jobforjunior
      - rabota_it_rus

  rabota:
    enabled: false
    access: manual
    apply: draft
    use_model: false

paths:
  db: output/jobagent.sqlite3
  output_dir: output

schedule:
  # для Task Scheduler / cron, сам агент расписание не держит
  search: "0 9,18 * * *"
  market_report: "0 10 * * 1"
