[project]
name = "job-agent"
version = "0.1.0"
description = "Личный ассистент по поиску работы: поиск, оценка, резюме, отклики"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "anthropic>=2.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",
    "pypdf>=5.1.0",
    "telethon>=1.36",
]

[project.scripts]
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
